                    check_min_seats:
                      type: boolean
                      description: |
                        Optional opt-in flag. When set to a truthy value, the booking is still created normally, but if the total requested seats are below the product's minimum booking seats (product.seats_min_booking), the success response includes a non-blocking data.warnings[] entry (code SEATS_BELOW_MINIMUM). When omitted, behavior and response shape are identical to the current API (no warnings key).
