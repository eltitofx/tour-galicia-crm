components:
  schemas:
    Oauth2token:
      type: object
      properties:
        access_token:
          type: string
          description: Token to perform API calls (valid for 3600 seconds)
          example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
        refresh_token:
          type: string
          description: Token to generete new access_token (valid for 60 days)
          example: eyJhbGciJzaGEyNTYiLCJ222XAiOiJTV1QifQ==.eyJpYXQiOjE1MjgyODg4N434ksInNob3J0X2lkIjoiVDQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.72fd741a18318793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
        type:
          type: string
          description: Type of authorization
          example: jwt
        access_ip:
          type: string
          description: Ip for authorization
          example: 81.45.129.79
        company_name:
          type: string
          description: Company name for authorization
          example: TuriTop Travel
        company_short_id:
          type: string
          description: Company short id
          example: T444
    Product:
      type: object
      required:
        - short_id
        - name
        - flow
        - summary
        - description
        - pricing_notes
        - duration
        - timezone
        - company_categories
        - images
      properties:
        supplier_company_short_id:
          type: string
          description: 'In resold products, it indicates the short_id of the supplier company. (Optional)'
          example: D220
        supplier_company_name:
          type: string
          description: 'In resold products, it indicates the name of the supplier company. (Optional)'
          example: DeepBlue Travels
        short_id:
          type: string
          description: Product short id
          example: P12
        name:
          type: string
          description: Product name
          example: Surf with dolphins
        flow:
          type: string
          description: |
            Type of flow in the purchase. Possible values:
              * tour
              * open
          example: tour
        summary:
          type: string
          description: Product summary
          example: You are never alone in the ocean.
        description:
          type: string
          description: Product description
          example: 'Oceans are teeming with life, intriguing and mysterious.\n There’s a whole underwater natural order that we land-dwellers are not always aware of.'
        pricing_notes:
          type: string
          description: Clarification on prices and types of tickets
