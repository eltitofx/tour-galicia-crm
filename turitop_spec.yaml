    BookingWarning:
      type: object
      description: |
        Non-blocking advisory warning attached to a successful booking response. Currently emitted only for the minimum-seats opt-in check (code SEATS_BELOW_MINIMUM) when check_min_seats is sent and the requested seats are below the product minimum.
      properties:
        code:
          type: string
          enum:
            - SEATS_BELOW_MINIMUM
          description: Machine-readable warning code
          example: SEATS_BELOW_MINIMUM
        message:
          type: string
          description: Human-readable warning message
          example: "Requested seats (2) are below the minimum booking seats (4). The booking was created."
        seats_min_booking:
          type: integer
          description: Product's configured minimum booking seats
          example: 4
        seats_requested:
          type: integer
          description: Total seats requested in the booking
          example: 2
    BookingDeleteErrorCode:
      type: string
      enum:
        - INVALID_SHORT_ID
        - PRODUCT_NOT_FOUND
        - BOOKING_ALREADY_DELETED
        - BOOKING_ALREADY_HARD_DELETED
        - BOOKING_NOT_FOUNDED
        - BOOKING_CANCELLATION_RESTRICTED
        - UNKNOWN
      description: |
        Machine-readable error code returned in the `400` response of `/booking/delete`.
        `BOOKING_CANCELLATION_RESTRICTED` is returned when the caller is a reseller
        (the booking hangs off a resale copy of the product), the event is in the future,
        and the current time falls inside the changes/cancellations anticipation window
        configured by the provider. The provider, on their own product, is never blocked
        by this restriction — the window only applies to resale bookings.
        `UNKNOWN` is a generic backend-refusal/catch-all outcome — not a specific business
        rejection — returned by the shared delete library for guard conditions and
        unclassified failures.
      example: BOOKING_CANCELLATION_RESTRICTED
    BookingUndeleteErrorCode:
      type: string
      enum:
        - INVALID_SHORT_ID
        - BOOKING_CANCELLATION_RESTRICTED
        - TIMEOUT
        - UNKNOWN
      description: |
        Machine-readable error code returned in the `400` response of `/booking/undelete`.
        `BOOKING_CANCELLATION_RESTRICTED` is returned when the caller is a reseller
        (the booking hangs off a resale copy of the product), the event is in the future,
        and the current time falls inside the changes/cancellations anticipation window
        configured by the provider. The provider, on their own product, is never blocked
        by this restriction — the window only applies to resale bookings.
        `TIMEOUT` means a concurrent undo already holds the undelete overbooking lock.
        `UNKNOWN` is a generic backend-refusal/catch-all outcome returned by the shared
        delete/undelete library. Some `400` rejections of this endpoint (already
        hard-deleted, not deleted) carry a `message` but no `error_code` — see the
        `400` response description below.
      example: BOOKING_CANCELLATION_RESTRICTED

  requestBodies:
    Body:
      content:
        application/json:
          schema:
            type: object
            required:
              - refresh_token
            properties:
              refresh_token:
                type: string
                description: Refresh token
                example: eyJhbGciJzaGEyNTYiLCJ222XAiOiJTV1QifQ==.eyJpYXQiOjE1MjgyODg4N434ksInNob3J0X2lkIjoiVDQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.72fd741a18318793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
      description: Authorization
    Body3:
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
              - data
            properties:
              access_token:
                type: string
                description: Access token
                example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
              data:
                type: object
                required:
                  - short_id
                properties:
                  short_id:
                    type: string
                    description: Booking short id
                    example: E227-T444-180821-1
                  hard_delete:
                    type: boolean
                    description: Permanently delete booking if set to true
                    example: false
      description: Booking
    Body5:
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
              - data
            properties:
              access_token:
                type: string
                description: Access token
                example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
              data:
                type: object
                required:
                  - short_id
                  - booking
                properties:
                  short_id:
                    type: string
                    description: Booking short id
                    example: T444-180829-1
                  booking:
                    type: object
                    description: Booking data
                    properties:
                      event_start:
                        type: integer
                        description: Date event start for booking
                      event_end:
                        type: integer
                        description: Date event finish for booking
                      ticket_type_count:
                        $ref: '#/components/schemas/TicketCount'
                      total_price:
                        type: number
                        description: Total price for booking
                      payment_partial:
                        type: number
                        description: Partial payment for booking
                      status:
                        $ref: '#/components/schemas/Status'
                      payment_gateway:
                        $ref: '#/components/schemas/PaymentGateway'
                      client_data:
                        $ref: '#/components/schemas/ClientData'
                      comments:
                        type: string
                        description: Comment for booking
                      notes:
                        type: string
                        description: Additional internal notes related to the booking. Not visible to customers
                      user_id:
                        type: integer
                        description: User identificator for Agents registered in the provider's panel
                    example:
                      booking:
                        event_start: 1535623200
                        event_end: 1535644800
                        status: pending
                        payment_gateway: stripe
                        client_data:
                          name: Test name
      description: Booking