                              description: 'Short identifier of the provider'
                              example: "T5"
                            name:
                              type: string
                              description: 'Name of the provider'
                              example: "Test SL"
                            country:
                              type: string
                              description: 'Country of the provider'
                              example: "Spain"
                            location:
                              type: string
                              description: 'Location of the provider'
                              example: "Santa Cruz de Tenerife"
                      pagination:
                        type: object
                        description: 'Pagination info for navigating through results'
                        properties:
                          current_page:
                            type: integer
                            description: 'The page number returned'
                            example: 1
                          page_size:
                            type: integer
                            description: 'Number of results per page (always 100)'
                            example: 100
                          total:
                            type: integer
                            description: 'Total number of providers in the marketplace'
                            example: 1
                          total_pages:
                            type: integer
                            description: 'Total number of pages available'
                            example: 1
                          has_more:
                            type: boolean
                            description: 'Whether there are more pages after the current one'
                            example: false
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/resell/getMarketplaceProviders
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1777041030
                  time_zone:
                    type: string
                    description: Time zone of server
                    example: Europe/Madrid
