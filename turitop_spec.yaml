  /discount/insert:
    post:
      tags:
        - Discount
      summary: Insert discount in a product
      description: |
        Inserts one discount, or a batch of single-use promotional-code discounts, on a product.
        Send `multiple_promo_code` to generate a batch (see its description below); otherwise a single discount is created.
        `data.discount` in the response is always an array, even for a single discount.
      operationId: post_discount_insert
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      discount:
                        type: array
                        description: Inserted discount(s). Always an array — a single-discount request also returns a one-element array.
                        items:
                          $ref: '#/components/schemas/Discount'
                        example:
                          - time_zone: Europe/Madrid
                            discount_id: '45661'
                            type: final_price
                            value: '10.00'
                            tickets_id: ["43989", "43990"]
                            agent_reseller_visibility: 'resellers'
                            apply_to_gift_voucher: '0'
                            anticipation: '24'
                            groupal_max_count: '10'
                            groupal_min_count: '5'
                            promo_code: "TEST"
                            cumulative: "1"
                            apply_to_deposit: "1"
                            weekdays: '1234567'
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                  time_zone:
                    type: integer
                    description: Time zone of server
                  status:
                    type: string
                    description: Response status
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                  message:
                    type: string
                    description: Response message
                  details:
                    type: string
                    description: Response details
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - data
              properties:
                access_token:
                  type: string
                  description: Access token. Replace the example value below with a real token obtained from `authorization/grant`.
                  example: <your_access_token>
                data:
                  type: object
                  required:
                    - product_short_id
                    - discount
                  properties:
                    product_short_id:
                      type: string
                      example: P1
                    discount:
                      type: object
                      required:
                        - type
                        - anticipation
                        - value
                      properties:
                        type:
                          type: string
                          description: |
                            Type of discount. Allowed values:
                              * percent_off
                              * final_price
                              * final_total_price
                              * final_total_price_minus
                        anticipation:
                          type: integer
                          description: Hours of anticipation for apply discount.
                        value:
                          type: number
                          description: Value of discount.
                        agent_reseller_visibility:
                          type: string
                          description: |
                            Discount visibility. Allowed values:
                              * no
                              * agents_and_resellers
                              * agents
                              * resellers
                        apply_to_gift_voucher:
                          type: boolean
                          description: Apply discount to gift voucher.
                        tickets_id:
                          type: array
                          items:
                            type: integer
                            description: |
                              Array of tickets_id. Does not compatible with ticket_id parameter. Only for discount type:
                                * percent_off
                                * final_price
                            properties:
                                ticket_id:
                                  type: integer
                                  description: ticket_id
                        ticket_id:
                          deprecated: true
                          type: integer
                          description: |
                            Ticket identificater. Does not compatible with tickets_id parameter. Only for discount type:
                              * percent_off
                              * final_price
                        date_from:
                          type: integer
                          description: Date event to start apply discount
                        date_to:
                          type: integer
                          description: Date event to finish apply discount
                        purchase_date_from:
                          type: integer
                          description: Purchase date to start apply discount
                        purchase_date_to:
                          type: integer
                          description: Purchase date to finish apply discount
                        uses:
                          type: integer
                          description: Number of uses of the promocode. Can only be used with a promocode
                        promo_code:
                          type: string
                          description: |
                            Promotional code required to redeem this discount. Mutually exclusive with `multiple_promo_code`.
                            Omitting both `promo_code` and `multiple_promo_code` creates a single discount with no promo code.
                        prefix:
                          type: string
                          description: |
                            Prefix prepended to each auto-generated promotional code. Only has effect together with `multiple_promo_code`; ignored otherwise.
                        weekdays:
                          type: string
                          description: Days of the week the promocode will apply. Numbers from 1 to 7. Week starts on monday
                        hour_from:
                          type: string
                          description: 'Hour to start applying the discount. 24 hour format (HH:mm)'
                        hour_to:
                          type: string
                          description: 'Hour to finish the using of the discount. 24 hour format (HH:mm)'
                        blacklist:
                          type: array
                          description: Array of timestamps indicating the date where the discount will not apply
                          items:
                            type: integer
                        group_max_count:
                          type: integer
                          description: Maximum seats to apply the discount
                        group_min_count:
                          type: integer
                          description: Minimum seats to apply the discount
                        apply_to_deposit:
                          type: boolean
                          description: If discount is applicable to deposit booking, not valid for dicount type final_total_price.
                        cumulative:
                          type: boolean
                          description: If discount is cumulative, not valid for dicount type final_total_price.
                        multiple_promo_code:
                          type: integer
                          minimum: 1
                          maximum: 1000
                          description: |
                            Number of promotional codes to generate in a batch, not a boolean flag. Each generated code is single-use (`uses` is forced to 1) and named `prefix` + a random identifier.
                            Mutually exclusive with `promo_code`; combine only with `prefix`.
                            Omitting this field — or sending `0`, `false`, `""`, or `null` — is how you request a single discount instead of a batch: those values are silently ignored, they do not raise a validation error.

                            Validation errors:
                              * `Wrong format` — value is present, non-zero and non-numeric
                              * `Allowed range 1 to 1000` — value is outside [1, 1000]
                              * `Not valid with promo_code` — sent together with `promo_code`

                            Batch example (generates single-use promotional codes sharing a prefix):
                            ```json
                            {
                              "access_token": "<your_access_token>",
                              "data": {
                                "product_short_id": "P1",
                                "discount": {
                                  "type": "final_price",
                                  "value": 10,
                                  "anticipation": 24,
                                  "tickets_id": [43989, 43990],
                                  "multiple_promo_code": 500,
                                  "prefix": "CORK-",
                                  "agent_reseller_visibility": "resellers",
                                  "apply_to_gift_voucher": false,
                                  "apply_to_deposit": true,
                                  "cumulative": true,
                                  "group_max_count": 10,
                                  "group_min_count": 5,
                                  "weekdays": "1234567"
                                }
                              }
                            }
                            ```
                      example:
                        type: final_price
                        value: 10
                        tickets_id: [43989, 43990]
                        anticipation: 24
                        promo_code: 'TEST'
                        uses: 1
                        agent_reseller_visibility: "resellers"
                        apply_to_gift_voucher: false
                        group_max_count: 10
                        group_min_count: 5
                        cumulative: true
                        apply_to_deposit: true
                        weekdays: '1234567'
        description: Insert product discount
