openapi: 3.0.0
servers:
  - url: 'https://app.turitopsandbox.com/v1'
    description: Sandbox environment. Official and only environment to be used for integration and testing purposes.
info:
  version: ApiTuritop3
  title: TuriTop API
  description: Move your app forward with Turitop API
tags:
  - name: Authorization
    description: Module to get API authorization
  - name: Product
    description: Module for managing products
  - name: Categories
    description: Module for managing categories
  - name: Tickets
    description: Module for managing product tickets
  - name: Discount
    description: Module for managing product discount
  - name: Variation
    description: Module for managing product variation
  - name: Booking
    description: Module for managing bookings
  - name: Resell
    description: Module for managing the resell
paths:
  /authorization/grant:
    post:
      tags:
        - Authorization
      summary: Get oauth2 access and refresh tokens (access tokens are valid for 60 minutes and refresh tokens are valid for 60 days)
      responses:
        '200':
          description: Authorization OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Oauth2token'
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/authorization/grant
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1534759136
                  time_zone:
                    type: string
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Authorization grant
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - short_id
                - secret_key
              properties:
                short_id:
                  type: string
                  description: Company short_id
                  example: T444
                secret_key:
                  type: string
                  description: Company secret key
                  example: mfzOyh=1O3M6T34sd0EA1fC9lyJUAFgSBRxt_1
        description: Authorization
  /authorization/refresh:
    post:
      tags:
        - Authorization
      summary: Generates a new access token when the previous one has expired or is about to expire, using a refresh token valid for up to 60 days
      responses:
        '200':
          description: Refresh authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Oauth2token'
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/authorization/refresh
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1534759136
                  time_zone:
                    type: string
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Refresh access token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        $ref: '#/components/requestBodies/Body'
  /authorization/renew:
    post:
      tags:
        - Authorization
      summary: Renew access and refresh token
      responses:
        '200':
          description: Renew access and refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Oauth2token'
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/authorization/renew
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1534759136
                  time_zone:
                    type: string
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Renew refresh token
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        $ref: '#/components/requestBodies/Body'
  /authorization/revoke:
    post:
      tags:
        - Authorization
      summary: This action revoke (invalidates) access and refresh tokens
      responses:
        '200':
          description: Revoke authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        $ref: '#/components/requestBodies/Body'
  /product/getsuppliers:
    post:
      tags:
        - Product
      summary: Get company suppliers
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      suppliers:
                        type: array
                        items:
                          type: object
                          properties:
                            supplier_company_short_id:
                              type: string
                              description: Supplier short_id
                              example: T000
                            supplier_company_name:
                              type: string
                              description: Supplier name
                              example: Company test name
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                  time_zone:
                    type: integer
                    description: Time zone of server
                  status:
                    type: string
                    description: Response status
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                  message:
                    type: string
                    description: Response message
                  details:
                    type: string
                    description: Response details
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
              properties:
                access_token:
                  type: string
                  description: Access token
                  example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
        description: Products request
  /product/getproducts:
