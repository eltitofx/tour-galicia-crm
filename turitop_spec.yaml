                    type: string
                    description: Call url
                    example: /v1/booking/delete
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1535541332
                  time_zone:
                    type: integer
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Delete booking by short_id
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/standardResponse'
                  - type: object
                    properties:
                      error_code:
                        $ref: '#/components/schemas/BookingDeleteErrorCode'
                      message:
                        type: string
                        description: Response message
                        example: "Booking cannot be cancelled because the provider does not allow changes or cancellations within 24 hours of the activity."
      requestBody:
        $ref: '#/components/requestBodies/Body3'
  /booking/undelete:
    post:
      tags:
        - Booking
      summary: Undelete booking by short_id.
      operationId: post_booking_undelete
      description: >
        A reseller can have this operation rejected on a resale booking whose event
        is in the future, when the current time falls inside the changes/cancellations
        anticipation window configured by the provider. The provider, on their own
        product, is never blocked by this restriction. The window is set by the
        provider, not by TuriTop, and therefore varies between providers.
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/booking/undelete
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1535541467
                  time_zone:
                    type: integer
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Undelete booking by short_id
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: >
            Request Error. Most rejections carry an `error_code`. Two rejections are
            message-only (no `error_code` in the payload): the booking was already
            hard-deleted ("Booking was deleted permanently, can not be undeleted") and
            the booking is not currently deleted ("Booking is not deleted").
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/standardResponse'
                  - type: object
                    properties:
                      error_code:
                        $ref: '#/components/schemas/BookingUndeleteErrorCode'
                      message:
                        type: string
                        description: >
                          Response message. For the two message-only rejections
                          (already hard-deleted, not deleted) this is the only
                          indication of the failure reason — `error_code` is absent.
                        example: "Booking cannot be restored because the provider does not allow changes or cancellations within 24 hours of the activity."
      requestBody:
        $ref: '#/components/requestBodies/Body3'
