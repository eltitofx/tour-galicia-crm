                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2026-04-24T16:30:30+02:00"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "27e390ed65d542e699c309f6fbdf4243"
                  code:
                    type: string
                    description: Response status code
                    example: '200'
