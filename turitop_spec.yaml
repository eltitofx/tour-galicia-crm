    Discount:
      type: object
      description: Discount data
      properties:
        time_zone:
          type: string
          description: Product time zone
        discount_id:
          type: string
          pattern: '^[0-9]+$'
          description: Discount identifier. Returned as a numeric string (the legacy driver returns every column as PHP string), never as a JSON integer.
          example: '45661'
        type:
          type: string
          description: Type of discount
        value:
          type: string
          pattern: '^-?[0-9]{1,3}(,[0-9]{3})*\.[0-9]{2}$'
          description: |
            Value of discount, formatted with exactly two decimals.

            Returned as a locale-formatted string, not a number. Values of 1000 or more
            include a comma as thousands separator: `1500` is returned as `"1,500.00"`, and
            `12345678.9` as `"12,345,678.90"`.

            Do NOT cast it directly: `parseFloat("1,500.00")` returns `1` and
            `Number("1,500.00")` returns `NaN`. Strip the commas before converting.
          example: '1,500.00'
        ticket_id:
          type: string
          pattern: '^[0-9]+$'
          description: Ticket identifier that apply discount. Sourced from a plain integer column (not a client-echoed value like tickets_id), so it is always a numeric string. Only present when tickets_id is not.
          example: '43989'
        tickets_id:
          type: array
          description: |
            Array of tickets id. Tickets identifier that apply discount.

            The element type mirrors what was sent when the discount was created: the API
            stores the client's JSON verbatim and decodes it back without normalising the
            element types, so posting `["43989"]` yields strings and posting `[43989]`
            yields integers. Clients must accept both.
          items:
            oneOf:
              - type: string
              - type: integer
          example: ['43989', 43990]
        agent_reseller_visibility:
          type: string
          description: Discounts visibility of agents and resellers
        apply_to_gift_voucher:
          type: string
          enum: ['0', '1']
          description: Apply discount to gift voucher. Returned as the string `"0"` or `"1"`, never as a JSON boolean.
          example: '1'
        anticipation:
          type: string
          pattern: '^[0-9]{1,4}$'
          description: Purchase anticipation in hours to apply the discount
          example: '24'
        groupal_max_count:
          type: string
          pattern: '^[0-9]+$'
          description: Maximum seats to apply the discount
          example: '10'
        groupal_min_count:
          type: string
          pattern: '^[0-9]+$'
          description: Minimum seats to apply the discount
          example: '5'
        date_from:
          type: integer
          format: int64
          description: Date event to start apply discount, EPOCH (Unix time)
          example: 1550052000
        date_to:
          type: integer
          format: int64
          description: Date event to finish apply discount, EPOCH (Unix time)
          example: 1550138400
        purchase_date_from:
          type: integer
          format: int64
          description: Date purchase to start apply discount, EPOCH (Unix time)
          example: 1550052000
        purchase_date_to:
          type: integer
          format: int64
          description: Date purchase to finish apply discount, EPOCH (Unix time)
          example: 1550138400
        promo_code:
          type: string
          description: Code to apply discount
        uses:
          type: string
          pattern: '^[0-9]+$'
          description: Number of uses of the promocode
          example: '3'
        uses_left:
          type: string
          pattern: '^-?[0-9]+$'
          description: |
            Number of uses left of the promocode. Can be negative: usage tracking on this
            field is not clamped at zero, and discounts overused before a limit change can
            carry a negative balance.
          example: '5'
        blacklist:
          type: array
          description: Array of timestamps indicating the date where the discount will not apply
          items:
            type: integer
        weekdays:
          type: string
          description: Days of the week the promocode will apply. Numbers from 1 to 7. Week starts on monday
        hour_from:
          type: string
          description: 'Hour to start applying the discount. 24 hour format (HH:mm)'
        hour_to:
          type: string
          description: 'Hour to finish the using of the discount. 24 hour format (HH:mm)'
        cumulative:
          type: string
          enum: ['0', '1']
          description: If discount is cumulative. Returned as the string `"0"` or `"1"`, never as a JSON boolean.
          example: '0'
        apply_to_deposit:
          type: string
          enum: ['1']
          description: |
            If discount is applicable to deposit booking. Only emitted when true: `formatDiscount`
            uses a falsy check that also excludes the string `"0"`, so this field is omitted
            entirely (not returned as `"0"`) when the discount does not apply to deposit.
          example: '1'
