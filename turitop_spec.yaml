                      example: en
        description: Available open
  /product/transfer/gethotels:
    post:
      tags:
        - Product
      summary: Get transfer hotels available for a product
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - transfer
                    properties:
                      transfer:
                        type: object
                        required:
                          - required
                          - hotels
                        properties:
                          required:
                            type: boolean
                            description: Transfer hotel is required
                            example: '0'
                          hotels:
                            type: array
                            items:
                              type: object
                              description: Array with transfer hotels
                              required:
                                - code
                                - name
                                - pickup_time_before_event
                              properties:
                                code:
                                  type: integer
                                  description: Code for transfer hotel
                                name:
                                  type: string
                                  description: Name for transfer hotel
                                pickup_time_before_event:
                                  type: integer
                                  description: Pick-up time, second before the event time
                                transfer_exception:
                                  type: array
                                  items:
                                    type: object
                                    description: Array with transfer point exception
                                    required:
                                      - time
                                      - pickup_time_before_event
                                    properties:
                                      time:
                                        type: integer
                                        description: Event time, in EPOCH (Unix time or POSIX time or Unix timestamp)
                                      pickup_time_before_event:
                                        type: integer
                                        description: Pick-up time, seconds before the event time
                            example:
                              - code: 17314
                                name: Hotel A
                                pickup_time_before_event: 2700
                                transfer_exception:
                                - time: 1538125200
                                  pickup_time_before_event: 3600
                              - code: 17367
                                name: Hotel B
                                pickup_time_before_event: 3000
                  method:
                    type: string
                    description: Http Method
