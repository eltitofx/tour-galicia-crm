                        additionalProperties:
                            type: string
                      prices_per_ticket:
                        type: object
                        description: |
                          List with ticket types as {integer : number}<br>
                          The first integer represents the ticket id in TuriTop and the second number represents the ticket price with discount if applicable
                        additionalProperties:
                            type: integer
                      prices_per_ticket_clean:
                        type: object
                        description: |
                          List with ticket types as {integer : number}<br>
                          The first integer represents the ticket id in TuriTop and the second number represents the ticket price with discount if applicable. Floating-point precision is normalized to ensure consistent decimal representation.
                        additionalProperties:
                            type: string
                      total_prices_full:
                        type: number
                        description: Sum of tickets price without discount, zero if not exist tickets in ticket_type_count
                        example: 50.50
                      total_prices_full_clean:
                        type: string
                        description: Sum of tickets price without discount, zero if not exist tickets in ticket_type_count. Floating-point precision is normalized to ensure consistent decimal representation.
                        example: "50.50"
                      total_prices:
                        type: number
                        description: sum of tickets price with discount if applicable, zero if not exist tickets in ticket_type_count
                        example: 50.50
                      total_prices_clean:
                        type: string
                        description: sum of tickets price with discount if applicable, zero if not exist tickets in ticket_type_count. Floating-point precision is normalized to ensure consistent decimal representation.
                        example: "50.50"
