    Event_closed_code:
      type: array
      description: |
        Event closed code:
          * 1000 - Event full
          * 2000 - Event autoclosed
          * 3000 - Event started
          * 4000 - Too late for online sales
          * 5000 - Maintenance or out of season
          * 6000 - Event during entire month
          * 7000 - Entire month closed
          * 8000 - Single event closed
          * 9000 - Entire day closed
      items:
        type: integer
        example: 1000
    Event:
      type: object
      required:
        - time
        - status
      properties:
        time:
          type: integer
          description: Event time in EPOCH (Unix time or POSIX time or Unix timestamp)
          example: 1602590400
        time_iso8601:
          type: string
          description: Even time in iso 8601 format
          example: "2020-10-13T00:00:00+0200"
        status:
          type: string
          description: Event status
          enum:
            - closed
            - open
        full:
          type: boolean
          description: If event is full
        code_closed:
          $ref: '#/components/schemas/Event_closed_code'
    IndividualEvent:
      type: object
      required:
        - time
      properties:
        time:
          type: integer
          description: Event time in EPOCH (Unix time or POSIX time or Unix timestamp)
          example: 1602590400
    AvailableEvent:
      type: object
      required:
        - time
        - status
      properties:
        time:
          type: integer
          description: Event time in EPOCH (Unix time or POSIX time or Unix timestamp)
        time_iso8601:
          type: string
          description: Event time in iso 8601 format
        status:
          type: string
          description: |
            Event status:
              * open - Display tickets_available
              * closed - Display code_closed
          enum:
            - open
            - closed
        full:
          type: boolean
          description: If event is fully booked
        max_seats_left:
          type: integer
          description: Maximum number of free seats for this event
        tickets_available:
          type: object
          description: List ticket available by event
          properties:
            indentifier_ticket:
              type: object
              required:
                - name
                - available
              properties:
                name:
                  type: string
                  description: Ticket name
                available:
                  type: integer
                  description: Number of tickets available for the event
                is_addon:
                  type: boolean
                  description: If ticket is addon
                seats:
                  type: integer
                  description: Number of seats the ticket occupies
                tickets_min:
                  type: integer
                  description: Minimum amount of tickets required to make the booking
                tickets_max:
                  type: integer
                  description: Maximum number tickets that can be booked
                prices_per_ticket_full:
                  type: number
                  description: Price per ticket when fully booked
                prices_per_ticket_full_clean:
                  type: string
                  description: Price per ticket when fully booked formatted as string to avoid floating-point precision issues
                cent_prices:
                  type: object
                  required:
                    - full
                    - full_clean
                    - per_ticket
                    - per_ticket_clean
                  properties:
                    full:
                      type: number
                      description: Price per ticket when fully booked in cents
                    full_clean:
                      type: number
                      description: Price per ticket when fully booked in cents as integer without decimals
                    per_ticket:
                      type: number
                      description: Price per ticket when not fully booked in cents
                    per_ticket_clean:
                      type: number
                      description: Price per ticket when not fully booked in cents as integer without decimals
                prices_per_ticket:
                  type: number
                  description: Ticket price without discount
                prices_per_ticket_clean:
                  type: string
                  description: Ticket price without discount formatted as string to avoid floating-point precision issues
        code_closed:
          $ref: '#/components/schemas/Event_closed_code'
      example:
        time: 1602590400
        status: open
        max_seats_left: 19
        tickets_available:
          '12342':
            name: Adult
            available: 14
            is_addon: 0
            seats: 1
            tickets_min: 0
            tickets_max: 50
            prices_per_ticket_full: 19.989999999999998
            prices_per_ticket_full_clean: "19.99"
            cent_prices:
              full: 1998
              full_clean: 1999
              per_ticket: 1998
              per_ticket_clean: 1999
            prices_per_ticket: 19.989999999999998
            prices_per_ticket_clean: "19.99"
          '15467':
            name: Child
            available: 19
            is_addon: 0
            seats: 1
            tickets_min: 0
            tickets_max: 50
            prices_per_ticket_full: 14.99
            prices_per_ticket_full_clean: "14.99"
            cent_prices:
              full: 1499
              full_clean: 1499
              per_ticket: 1499
              per_ticket_clean: 1499
            prices_per_ticket: 14.99
            prices_per_ticket_clean: "14.99"
