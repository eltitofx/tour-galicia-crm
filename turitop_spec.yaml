                        This is the preferred language. If translation is not found, it will return value in original language
                      example: en
        description: Events
  /product/tour/getavailable:
    post:
      tags:
        - Product
      summary: Get available for tour products
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product_short_id:
                        type: string
                        description: Product short id
                        example: P1
                      datetime_format:
                        type: string
                        description: Product date time format
                        example: 'd-m-Y H:i'
                      currency:
                        type: string
                        description: Product currency
                        example: EUR
                      time_zone:
                        type: string
                        description: Product time zone
                        example: Europe/Madrid
                      max_seats_buy:
                        type: integer
                        description: |
                          Max seat for booking:
                            * if 0 not exist max seat for booking
                        example: 0
                      min_seats_buy:
                        type: integer
                        description: |
                          Min seat for booking:
                            * 0 = no minimum configured
                        example: 0
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/AvailableEvent'
                      cutoff:
                        type: number
                        description: Limit, in seconds from now, that defines the minimum selectable date in the datepicker
                        example: 7200
                      total_prices_full:
                        type: number
                        description: Total price without discount
                        example:  34.979999999999997
                      total_prices:
                        type: number
                        description: Total price with discount
                        example:  34.979999999999997
                      total_prices_full_clean:
                        type: string
                        description: Total price without discount formatted as string to avoid floating-point precision issues
                        example:  "34.98"
                      total_prices_clean:
                        type: string
                        description: Total price with discount formatted as string to avoid floating-point precision issues
                        example:  "34.98"

                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                    example: /v1/product/tour/getavailable
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                    example: 1535468836
                  time_zone:
                    type: integer
                    description: Time zone of server
                    example: Europe/Madrid
                  status:
                    type: string
                    description: Response status
                    example: SUCCESS
                  local_time:
                    type: string
                    description: 'Local time for the response (ISO 8601 format)'
                    example: "2023-10-19T13:00:00+0200"
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                    example: '200'
                  message:
                    type: string
                    description: Response message
                    example: HTTP OK
                  details:
                    type: string
                    description: Response details
                    example: Available
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - data
              properties:
                access_token:
                  type: string
                  description: Access token
                  example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
                data:
                  type: object
                  required:
                    - product_short_id
                    - start_date
                    - end_date
                  properties:
                    product_short_id:
                      type: string
                      example: P1
                    start_date:
                      type: integer
                      description: EPOCH (Unix time or POSIX time or Unix timestamp)
                      example: 1602590400
                    end_date:
                      type: integer
                      description: EPOCH (Unix time or POSIX time or Unix timestamp)
                      example: 1602615600
                    language_code:
                      type: string
                      description: |
                        ISO 639-1. Standard nomenclature used to classify languages <br>
                        This is the preferred language. If translation is not found, it will return value in original language
                      example: en
                    ticket_type_count:
                      $ref: '#/components/schemas/TicketCount'
                      description: Returns the availability and prices for each ticket
                    gift_certificate:
                      type: boolean
                      description: Return prices and availability for a gift voucher
                    show_ticket_prices:
                      type: boolean
                      description: Return all ticket prices
                    promo_code:
                      type: string
                      description: Applies the promocode to the prices returned. Must be used along ticket_type_count
        description: Available tour
