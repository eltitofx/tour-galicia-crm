  /booking/delete:
    post:
      tags:
        - Booking
      summary: Delete booking by short_id.
      operationId: post_booking_delete
      description: >
        A reseller can have this operation rejected on a resale booking whose event
        is in the future, when the current time falls inside the changes/cancellations
        anticipation window configured by the provider. The provider, on their own
        product, is never blocked by this restriction. The window is set by the
        provider, not by TuriTop, and therefore varies between providers.
      responses:
        '200':
          description: Request OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    type: string
                    description: Http Method
                    example: POST
