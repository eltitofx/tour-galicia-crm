                  method:
                    type: string
                    description: Http Method
                    example: POST
                  url:
                    type: string
                    description: Call url
                  timestamp:
                    type: integer
                    description: 'Server time, EPOCH (Unix time or POSIX time or Unix timestamp)'
                  time_zone:
                    type: integer
                    description: Time zone of server
                  status:
                    type: string
                    description: Response status
                  request_id:
                    type: string
                    description: 'Unique identifier for the request'
                    example: "caae62f7876a4b878c8d0e9b5c4b259b"
                  code:
                    type: integer
                    description: Response status code
                  message:
                    type: string
                    description: Response message
                  details:
                    type: string
                    description: Response details
                  version:
                    type: string
                    description: Version Turitop App
                    example: 2.60.30
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
              properties:
                access_token:
                  type: string
                  description: Access token
                  example: ttJhbGciJzaXQASDCJ222XAiOiJTV1QifQ==.ttJpYXQiOjE1MjgyODg4N4TESTAsdeasdQ0NCIsImFjY2Vzc19I6IjgxLjQ1LjEyOS43OSIsInR5cGUiOiJyZWZyZXNoIn0=.722332aasd793123395856b2c820e2323d0974c082a7c6a9d2df5bf8b73f5
                data:
                  type: object
                  properties:
                    language_code:
                      type: string
                      description: |
                        ISO 639-1. Standard nomenclature used to classify languages <br>
                        This is the preferred language. If translation is not found, it will return value in original language
                      example: en
                    supplier_company_short_id:
                      type: string
                      description: Get products from other companies that you are reselling. <br> **Note:** Do NOT add this parameter to get your own products, just make the call without this parameter
                      example: T000
                    product_short_id:
                      type: string
                      description: Get product by short id.
                      example: P1
                    include_disabled:
                      type: boolean
                      description: |
                        Optional. Default false. When true, disabled products are returned as well
                        (both your own disabled products and resold products whose original is
                        disabled), each flagged with disabled: true. When false or omitted,
                        disabled products are excluded.
                      example: false
        description: Products request
  /product/tour/getevents:
    post:
      tags:
        - Product
      summary: Get events of a tour
      responses:
        '200':
          description: Request OK
          content:
