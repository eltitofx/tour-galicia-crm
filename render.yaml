services:
  - type: web
    name: tour-galicia-crm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TURITOP_SHORT_ID
        value: T955
      - key: TURITOP_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: simulator
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_INSTANCE
        value: tour-galicia
